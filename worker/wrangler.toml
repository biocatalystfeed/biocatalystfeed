# BioCatalystFeed hosted MCP endpoint (Cloudflare Workers, free plan).
# Deploy: npx wrangler deploy   (needs CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID)
# Serves https://bcf-mcp.<account-subdomain>.workers.dev/mcp ; no custom domain / DNS.
name = "bcf-mcp"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

[vars]
# Optional: if set, /mcp requests are proxied to a full Python BCF server (streamable HTTP) instead of the built-in tools.
UPSTREAM_MCP_URL = ""

# Per-IP rate limit: one SQLite-backed Durable Object per client IP (free plan), fixed 60 s window.
# Limits: RATE_LIMIT / RATE_WINDOW_MS in src/index.js.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "IpRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IpRateLimiter"]

# Workers Logs (dashboard observability) is off: no request logs stored by us. Enable only temporarily for debugging.
[observability]
enabled = false
